services:
  # ---------------------------------------------------------------------------
  # 1. Django ASGI Web Application (HTTP & WebSockets via Daphne)
  # ---------------------------------------------------------------------------
  - type: web
    name: nomad-bot-web
    runtime: docker
    dockerfilePath: ./Dockerfile
    dockerCommand: bash scripts/run_web.sh
    plan: free
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: REDIS_URL
        fromService:
          type: redis
          name: nomad-bot-redis
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      - key: WORKER_WAKE_TOKEN
        generateValue: true
      - key: WORKER_1_URL
        sync: false
      - key: WORKER_2_URL
        sync: false
      - key: DEBUG
        value: "False"
      - key: ALLOWED_HOSTS
        value: "*"
      - key: DJANGO_SETTINGS_MODULE
        value: config.settings
      - key: GEMINI_API_KEY
        sync: false
      - key: GOOGLE_PLACES_API_KEY
        sync: false
      - key: APOLLO_API_KEY
        sync: false

      - key: LINKEDIN_PUBLISH_WEBHOOK_URL
        sync: false
      - key: LINKEDIN_PUBLISH_WEBHOOK_SECRET
        sync: false
      - key: LINKEDIN_GENERATE_IMAGES
        value: "False"
      - key: OPENAI_API_KEY
        sync: false
      - key: PUBLIC_BACKEND_URL
        sync: false

  # ---------------------------------------------------------------------------
  # 2. Remote Celery Worker Service #1 (Dual-Process: Worker + Health Server)
  # ---------------------------------------------------------------------------
  - type: web
    name: nomad-bot-worker-1
    runtime: docker
    dockerfilePath: ./Dockerfile
    dockerCommand: bash scripts/run_worker.sh
    plan: free
    healthCheckPath: /health
    envVars:
      - key: WORKER_NAME
        value: worker-1
      - key: RUN_CELERY_BEAT
        value: "True"
      - key: DATABASE_URL
        sync: false
      - key: REDIS_URL
        fromService:
          type: redis
          name: nomad-bot-redis
          property: connectionString
      - key: SECRET_KEY
        fromService:
          type: web
          name: nomad-bot-web
          envVarKey: SECRET_KEY
      - key: WORKER_WAKE_TOKEN
        fromService:
          type: web
          name: nomad-bot-web
          envVarKey: WORKER_WAKE_TOKEN
      - key: WORKER_1_URL
        sync: false
      - key: WORKER_2_URL
        sync: false
      - key: DJANGO_SETTINGS_MODULE
        value: config.settings
      - key: GEMINI_API_KEY
        sync: false
      - key: GOOGLE_PLACES_API_KEY
        sync: false
      - key: APOLLO_API_KEY
        sync: false
      - key: LINKEDIN_PUBLISH_WEBHOOK_URL
        sync: false
      - key: LINKEDIN_PUBLISH_WEBHOOK_SECRET
        sync: false
      - key: LINKEDIN_GENERATE_IMAGES
        value: "False"
      - key: OPENAI_API_KEY
        sync: false
      - key: PUBLIC_BACKEND_URL
        sync: false

  # ---------------------------------------------------------------------------
  # 3. Remote Celery Worker Service #2 (Dual-Process: Worker + Health Server)
  # ---------------------------------------------------------------------------
  - type: web
    name: nomad-bot-worker-2
    runtime: docker
    dockerfilePath: ./Dockerfile
    dockerCommand: bash scripts/run_worker.sh
    plan: free
    healthCheckPath: /health
    envVars:
      - key: WORKER_NAME
        value: worker-2
      - key: DATABASE_URL
        sync: false
      - key: REDIS_URL
        fromService:
          type: redis
          name: nomad-bot-redis
          property: connectionString
      - key: SECRET_KEY
        fromService:
          type: web
          name: nomad-bot-web
          envVarKey: SECRET_KEY
      - key: WORKER_WAKE_TOKEN
        fromService:
          type: web
          name: nomad-bot-web
          envVarKey: WORKER_WAKE_TOKEN
      - key: WORKER_1_URL
        sync: false
      - key: WORKER_2_URL
        sync: false
      - key: DJANGO_SETTINGS_MODULE
        value: config.settings
      - key: GEMINI_API_KEY
        sync: false
      - key: GOOGLE_PLACES_API_KEY
        sync: false
      - key: APOLLO_API_KEY
        sync: false
      - key: LINKEDIN_PUBLISH_WEBHOOK_URL
        sync: false
      - key: LINKEDIN_PUBLISH_WEBHOOK_SECRET
        sync: false
      - key: LINKEDIN_GENERATE_IMAGES
        value: "False"
      - key: OPENAI_API_KEY
        sync: false
      - key: PUBLIC_BACKEND_URL
        sync: false

  # ---------------------------------------------------------------------------
  # 4. Redis / Key Value Message Broker
  # ---------------------------------------------------------------------------
  - type: redis
    name: nomad-bot-redis
    plan: free
    ipAllowList: [] # internal access only
